<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Test App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        .status {
            padding: 15px;
            background: #e8f5e8;
            border-radius: 8px;
            margin: 20px 0;
            color: #2d5a2d;
        }
        .button {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin: 10px;
        }
        .button:hover {
            background: #5a6fd8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Mobile Test App</h1>
        <div class="status">
            ✅ Successfully connected from mobile device!
        </div>
        <p>If you can see this page on your mobile device, the connection is working!</p>
        <button class="button" onclick="showInfo()">Show Device Info</button>
        <button class="button" onclick="getLocation()">Get Location</button>
        <div id="info"></div>
    </div>

    <script>
        function showInfo() {
            const info = document.getElementById('info');
            info.innerHTML = `
                <div style="margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 8px;">
                    <h3>Device Information:</h3>
                    <p><strong>User Agent:</strong> ${navigator.userAgent}</p>
                    <p><strong>Screen Size:</strong> ${screen.width} x ${screen.height}</p>
                    <p><strong>Viewport:</strong> ${window.innerWidth} x ${window.innerHeight}</p>
                    <p><strong>Platform:</strong> ${navigator.platform}</p>
                    <p><strong>Language:</strong> ${navigator.language}</p>
                </div>
            `;
        }

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const info = document.getElementById('info');
                        info.innerHTML = `
                            <div style="margin-top: 20px; padding: 15px; background: #e8f5e8; border-radius: 8px;">
                                <h3>Location Information:</h3>
                                <p><strong>Latitude:</strong> ${position.coords.latitude}</p>
                                <p><strong>Longitude:</strong> ${position.coords.longitude}</p>
                                <p><strong>Accuracy:</strong> ${position.coords.accuracy} meters</p>
                            </div>
                        `;
                    },
                    function(error) {
                        const info = document.getElementById('info');
                        info.innerHTML = `
                            <div style="margin-top: 20px; padding: 15px; background: #ffe8e8; border-radius: 8px;">
                                <h3>Location Error:</h3>
                                <p>${error.message}</p>
                            </div>
                        `;
                    }
                );
            } else {
                const info = document.getElementById('info');
                info.innerHTML = `
                    <div style="margin-top: 20px; padding: 15px; background: #ffe8e8; border-radius: 8px;">
                        <h3>Location Error:</h3>
                        <p>Geolocation is not supported by this browser.</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
